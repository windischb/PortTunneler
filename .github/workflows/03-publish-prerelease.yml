name: Publish Prerelease

on:
  workflow_dispatch:

concurrency:
  group: publish-prerelease
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-multiplatform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - uses: gittools/actions/gitversion/execute@v3
        id: gitversion

      - name: Build
        run: >-
          dotnet build src/PortTunneler.sln -c Release
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}
          -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}

      - name: Test
        run: dotnet test src/PortTunneler.sln -c Release --no-build

  publish-prerelease:
    name: Publish (${{ matrix.rid }})
    needs: test-multiplatform
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: PortTunneler-linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            artifact: PortTunneler-linux-arm64
          - os: windows-latest
            rid: win-x64
            artifact: PortTunneler-win-x64.exe
          - os: windows-11-arm
            rid: win-arm64
            artifact: PortTunneler-win-arm64.exe
          - os: macos-latest
            rid: osx-arm64
            artifact: PortTunneler-macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - uses: gittools/actions/gitversion/execute@v3
        id: gitversion

      - name: Publish AOT
        run: >-
          dotnet publish src/PortTunneler/PortTunneler.csproj -c Release
          -r ${{ matrix.rid }}
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}
          -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}

      - name: Rename binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv src/PortTunneler/bin/Release/net10.0/${{ matrix.rid }}/publish/PortTunneler ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv src/PortTunneler/bin/Release/net10.0/${{ matrix.rid }}/publish/PortTunneler.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  create-release:
    name: Create Prerelease
    needs: publish-prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - uses: gittools/actions/gitversion/execute@v3
        id: gitversion

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ steps.gitversion.outputs.semVer }}"
          --prerelease
          --generate-notes
          --title "v${{ steps.gitversion.outputs.semVer }}"
          artifacts/PortTunneler-linux-x64/PortTunneler-linux-x64
          artifacts/PortTunneler-linux-arm64/PortTunneler-linux-arm64
          artifacts/PortTunneler-win-x64.exe/PortTunneler-win-x64.exe
          artifacts/PortTunneler-win-arm64.exe/PortTunneler-win-arm64.exe
          artifacts/PortTunneler-macos-arm64/PortTunneler-macos-arm64
